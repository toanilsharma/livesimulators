[build]
  command = "npm run build"
  publish = "dist"

# Explicit static file pass-through redirects (prevent SPA fallback interception)
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/llms-full.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# 301 Redirect non-trailing-slash routes to standardized trailing-slash URLs
[[redirects]]
  from = "/simulator/:slug"
  to = "/simulator/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/department/:dept"
  to = "/department/:dept/"
  status = 301
  force = true

[[redirects]]
  from = "/lab/:lab"
  to = "/lab/:lab/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/cookie-policy"
  to = "/cookie-policy/"
  status = 301
  force = true

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy/"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 301
  force = true

# Client-side Single Page Application fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sitewide Security & Policy Headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Explicit Headers for AI Crawlers & LLM Discovery Files
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Explicit Headers for XML Sitemap
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/hub/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    Access-Control-Max-Age = "300"
